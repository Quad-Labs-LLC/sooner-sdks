[package]
name = "sooner-email"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Typed async Rust SDK for the Sooner email API"
repository = "https://github.com/Quad-Labs-LLC/sooner-sdks"
license = "MIT"
homepage = "https://sooner.dev"
readme = "README.md"
keywords = ["email", "transactional", "sooner"]
categories = ["api-bindings", "email"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }
